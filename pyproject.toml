[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oeydesign"
version = "0.1.0"
description = "Contract-first reference implementation for OEYdesign"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=11.0,<13",
    "playwright>=1.50,<2",
    "PySide6>=6.8,<7",
]

[project.scripts]
oeydesign-gui = "gui_client.app:main"
oeydesign-web = "oeydesign.product_shell:main"

[tool.setuptools]
packages = ["oeydesign", "gui_client", "gui_client.panels"]

[tool.setuptools.package-dir]
oeydesign = "src/oeydesign"
gui_client = "gui_client"
"gui_client.panels" = "gui_client/panels"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
