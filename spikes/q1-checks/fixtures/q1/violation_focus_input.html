<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invisible input focus</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #ffffff; color: #161616; font: 16px/1.5 Arial, sans-serif; }
    main { width: calc(100% - 32px); max-width: 760px; margin: 24px auto; }
    .panel { padding: 24px; border: 1px solid #767676; border-radius: 8px; }
    button, input, a, [tabindex] { font: inherit; }
    .target { border:2px solid #555; padding:8px; } .target:focus, .target:focus-visible { outline:none; box-shadow:none; border-color:#555; }
  </style>
</head>
<body>
  <main data-oey-section="fixture"><label data-oey-object="fixture.label">Email <input class="target" data-oey-object="fixture.target" value="reader@example.test"></label></main>
  
</body>
</html>
