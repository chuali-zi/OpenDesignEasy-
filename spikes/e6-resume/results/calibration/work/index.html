<body>
  <h1>SproutBox</h1>
  <p id="intro">SproutBox is a tiny countertop garden that grows fresh basil, mint,

  tracks daylight with a small sensor, and sends a gentle reminder when your
  herbs are ready to snip — no soil, no mess, no green thumb required.</p>
