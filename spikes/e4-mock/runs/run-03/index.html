<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit · Agent 工作台</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar" data-oey-section="topbar">
  <div class="brand" data-oey-object="topbar.brand">
    <span class="brand-mark">◈</span> Orbit
  </div>
  <div class="topbar-current">
    <span class="crumb-label">当前项目</span>
    <strong id="topbar-project-name" data-oey-object="topbar.project">—</strong>
    <span id="topbar-project-model" class="crumb-model" data-oey-object="topbar.model">—</span>
  </div>
  <div class="topbar-right">
    <span class="env-badge" data-oey-object="topbar.env" title="所有数据来自前端 mock 层，无真实后端">本地 mock 环境</span>
  </div>
</header>

<div class="layout">

  <!-- 项目列表区 -->
  <aside class="sidebar" data-oey-section="projects">
    <div class="sidebar-head">
      <h2 data-oey-object="projects.title">项目会话</h2>
      <span id="project-count" class="count-badge" data-oey-object="projects.count">0</span>
    </div>
    <ul id="project-list" class="project-list" data-oey-object="projects.list"></ul>
    <div class="sidebar-foot" data-oey-object="projects.hint">点击任意项目即可切换上下文</div>
  </aside>

  <!-- 对话区 -->
  <main class="conversation" data-oey-section="conversation">
    <div id="message-list" class="message-list" data-oey-object="conversation.messages"></div>

    <div id="typing-indicator" class="typing hidden" data-oey-object="conversation.typing">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="typing-text">agent 正在思考…</span>
    </div>

    <form id="composer" class="composer">
      <textarea id="composer-input" rows="2"
        placeholder="向 agent 描述你的需求…（Enter 发送，Shift+Enter 换行）"
        data-oey-object="conversation.input"></textarea>
      <button type="submit" id="composer-send" data-oey-object="conversation.send">发送</button>
    </form>
  </main>

  <!-- 预览区 -->
  <aside class="preview" data-oey-section="preview">
    <div class="preview-head">
      <h2 data-oey-object="preview.title">产出预览</h2>
      <span id="preview-kind" class="kind-badge" data-oey-object="preview.kind">—</span>
    </div>
    <div id="preview-body" class="preview-body" data-oey-object="preview.body">
      <div class="preview-empty" data-oey-object="preview.empty">暂无产出</div>
    </div>
    <div class="preview-foot" id="preview-meta" data-oey-object="preview.meta">—</div>
  </aside>

</div>

<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
