<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus · Agent 工作台</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">

  <!-- ============ 顶栏 ============ -->
  <header class="topbar" data-oey-section="topbar">
    <div class="topbar-left">
      <span class="logo-mark" aria-hidden="true"></span>
      <span class="logo-text" data-oey-object="topbar.brand">Nexus 工作台</span>
      <span class="env-badge" data-oey-object="topbar.env">本地原型 · Mock 数据</span>
    </div>
    <div class="topbar-right">
      <span class="net-status" id="netStatus" data-oey-object="topbar.network">mock 链路正常</span>
    </div>
  </header>

  <div class="app-body">

    <!-- ============ 项目列表区 ============ -->
    <aside class="sidebar" data-oey-section="projects">
      <div class="sidebar-head">
        <h2 class="sidebar-title" data-oey-object="projects.title">项目 / 会话</h2>
        <button class="btn-ghost" id="btnNewProject" data-oey-object="projects.newButton" title="新建一个空项目">＋ 新建</button>
      </div>
      <ul class="project-list" id="projectList" data-oey-object="projects.list">
        <!-- 列表项由 app.js 渲染，结构：
             <li class="project-item" data-oey-object="projects.item">
               <span class="project-dot" data-oey-object="projects.item.dot"></span>
               <span class="project-name" data-oey-object="projects.item.name"></span>
               <span class="project-meta" data-oey-object="projects.item.meta"></span>
               <span class="project-status" data-oey-object="projects.item.status"></span>
             </li> -->
      </ul>
      <div class="sidebar-foot">
        <span class="foot-hint" data-oey-object="projects.hint">点击任意项目切换上下文</span>
      </div>
    </aside>

    <!-- ============ 对话区 ============ -->
    <main class="chat-pane" data-oey-section="chat">
      <div class="chat-head">
        <div class="chat-head-main">
          <h1 class="chat-title" id="chatTitle" data-oey-object="chat.title">加载中…</h1>
          <p class="chat-subtitle" id="chatSubtitle" data-oey-object="chat.subtitle"></p>
        </div>
        <span class="chat-agent-tag" data-oey-object="chat.agentTag">Agent · nexus-1</span>
      </div>

      <div class="chat-messages" id="chatMessages" data-oey-object="chat.messages">
        <!-- 消息气泡由 app.js 渲染，结构：
             <div class="msg msg-user|msg-agent" data-oey-object="chat.message">
               <div class="msg-author" data-oey-object="chat.message.author"></div>
               <div class="msg-bubble" data-oey-object="chat.message.text"></div>
               <div class="msg-time" data-oey-object="chat.message.time"></div>
             </div> -->
      </div>

      <div class="typing-indicator hidden" id="typingIndicator" data-oey-object="chat.typing">
        <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
        <span class="typing-label">agent 正在组织回复…</span>
      </div>

      <form class="composer" id="composer" data-oey-object="chat.composer">
        <textarea id="composerInput" class="composer-input" rows="2"
                  placeholder="给 agent 发一条指令，例如：帮我生成一段代码 / 出一份总结 / 整理成表格"
                  data-oey-object="chat.composer.input"></textarea>
        <button type="submit" class="composer-send" id="composerSend" data-oey-object="chat.composer.send">发送</button>
      </form>
    </main>

    <!-- ============ 预览区 ============ -->
    <section class="preview-pane" data-oey-section="preview">
      <div class="preview-head">
        <h2 class="preview-title" data-oey-object="preview.title">产出预览</h2>
        <span class="preview-kind" id="previewKind" data-oey-object="preview.kind">—</span>
      </div>
      <div class="preview-body" id="previewBody" data-oey-object="preview.body">
        <!-- 预览卡片由 app.js 渲染，结构：
             <article class="preview-card" data-oey-object="preview.card">
               <h3 class="preview-card-title" data-oey-object="preview.card.title"></h3>
               <div class="preview-card-content" data-oey-object="preview.card.content"></div>
               <div class="preview-card-foot" data-oey-object="preview.card.meta"></div>
             </article> -->
      </div>
    </section>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
