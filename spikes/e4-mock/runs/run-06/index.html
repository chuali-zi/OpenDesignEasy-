<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaDesk · Agent 工作台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">

    <!-- ============ 顶部栏 ============ -->
    <header class="topbar" data-oey-section="topbar">
      <div class="topbar-brand">
        <span class="brand-mark">◈</span>
        <span class="brand-name" data-oey-object="topbar.brand">NovaDesk</span>
        <span class="brand-tag" data-oey-object="topbar.tagline">Agent 工作台</span>
      </div>
      <div class="topbar-right">
        <span class="mock-badge" data-oey-object="topbar.env-badge">MOCK 环境 · 无真实后端</span>
        <span class="avatar" data-oey-object="topbar.user">研</span>
      </div>
    </header>

    <div class="app-body">

      <!-- ============ 项目列表区 ============ -->
      <aside class="sidebar" data-oey-section="project-list">
        <div class="sidebar-head">
          <h2 class="sidebar-title" data-oey-object="project-list.title">项目 / 会话</h2>
          <span class="sidebar-count" data-oey-object="project-list.count" id="project-count">0</span>
        </div>
        <div class="sidebar-search">
          <input type="text" id="project-search" data-oey-object="project-list.search"
                 placeholder="搜索项目…" autocomplete="off">
        </div>
        <ul class="project-list" id="project-list" data-oey-object="project-list.items"></ul>
        <div class="sidebar-foot">
          <button class="btn-new-project" id="btn-new-project" data-oey-object="project-list.new-button">＋ 新建项目</button>
        </div>
      </aside>

      <!-- ============ 对话区 ============ -->
      <main class="chat-panel" data-oey-section="chat">
        <div class="chat-header">
          <div class="chat-header-main">
            <h1 class="chat-project-name" id="chat-project-name" data-oey-object="chat.project-name">—</h1>
            <p class="chat-project-desc" id="chat-project-desc" data-oey-object="chat.project-desc">—</p>
          </div>
          <span class="chat-status" id="chat-status" data-oey-object="chat.status">就绪</span>
        </div>

        <div class="chat-messages" id="chat-messages" data-oey-object="chat.messages"></div>

        <div class="chat-input-bar">
          <textarea id="chat-input" rows="2" data-oey-object="chat.input"
                    placeholder="给 Agent 发条消息… (Enter 发送, Shift+Enter 换行)"></textarea>
          <button id="chat-send" class="btn-send" data-oey-object="chat.send-button">发送 ➤</button>
        </div>
      </main>

      <!-- ============ 预览区 ============ -->
      <section class="preview-panel" data-oey-section="preview">
        <div class="preview-header">
          <h2 class="preview-heading" data-oey-object="preview.heading">产出预览</h2>
          <span class="preview-type-badge" id="preview-type" data-oey-object="preview.type">—</span>
        </div>
        <div class="preview-body" id="preview-body" data-oey-object="preview.content">
          <div class="preview-empty" data-oey-object="preview.empty">选择左侧项目后，这里会展示对应的产出。</div>
        </div>
        <div class="preview-footer">
          <span class="preview-meta" id="preview-meta" data-oey-object="preview.meta">—</span>
        </div>
      </section>

    </div>
  </div>

  <script src="mock-api.js"></script>
  <script src="app.js"></script>
</body>
</html>
