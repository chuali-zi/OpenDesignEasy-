<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus · Agent 工作台</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <header class="topbar" data-oey-section="topbar">
    <div class="brand" data-oey-object="topbar.brand">NEXUS <span>Agent 工作台</span></div>
    <div class="topbar-right">
      <span class="mock-badge" data-oey-object="topbar.env">本地 Mock 环境 · 无真实后端</span>
    </div>
  </header>

  <div class="layout">

    <aside class="sidebar" data-oey-section="project-list">
      <div class="sidebar-head">
        <h2 data-oey-object="project-list.title">项目</h2>
        <span class="count" id="projectCount" data-oey-object="project-list.count">0</span>
      </div>
      <ul class="project-items" id="projectItems" data-oey-object="project-list.items"></ul>
      <p class="sidebar-hint" data-oey-object="project-list.hint">点击项目即可切换当前会话与预览产物。</p>
    </aside>

    <main class="chat" data-oey-section="chat">
      <header class="chat-head">
        <div class="chat-head-main">
          <h1 id="chatProjectName" data-oey-object="chat.project-name">—</h1>
          <p class="chat-sub" id="chatProjectDesc" data-oey-object="chat.project-desc"></p>
        </div>
        <span class="chat-status" id="chatStatus" data-oey-object="chat.status"></span>
      </header>

      <div class="messages" id="messages" data-oey-object="chat.messages"></div>

      <form class="composer" id="composer" data-oey-object="chat.composer">
        <textarea id="input" rows="2" placeholder="给 Agent 下达指令…（Enter 发送，Shift+Enter 换行）" data-oey-object="chat.input"></textarea>
        <button type="submit" id="sendBtn" data-oey-object="chat.send">发送</button>
      </form>
    </main>

    <section class="preview" data-oey-section="preview">
      <header class="preview-head">
        <div class="preview-head-main">
          <h2 id="previewTitle" data-oey-object="preview.title">—</h2>
          <span class="preview-file" id="previewFile" data-oey-object="preview.file"></span>
        </div>
        <span class="version" id="previewVersion" data-oey-object="preview.version"></span>
      </header>
      <div class="preview-body" data-oey-object="preview.body">
        <pre class="code"><code id="previewCode" data-oey-object="preview.code"></code></pre>
        <div class="revisions">
          <h3 data-oey-object="preview.revisions-title">修订记录</h3>
          <ul id="revisionList" data-oey-object="preview.revisions"></ul>
        </div>
      </div>
    </section>

  </div>
</div>
<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
